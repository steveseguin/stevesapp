<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/remote.webmanifest">
  <meta name="theme-color" content="#1a1a2e">
  <title>Steve's App - Remote Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #1a1a2e;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #connect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      min-height: 0;
      overflow-y: auto;
    }
    #connect-screen h1 { color: #e94560; margin-bottom: 20px; }
    #connect-screen input {
      width: 100%;
      max-width: 300px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #2a2a4e;
      border-radius: 6px;
      background: #16213e;
      color: #eaeaea;
      font-size: 16px;
    }
    #connect-screen button {
      padding: 12px 32px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .install-btn {
      margin-top: 10px;
      padding: 10px 24px;
      background: transparent;
      color: #a0a0a0;
      border: 1px solid #2a2a4e;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    #status { margin-top: 15px; color: #a0a0a0; }
    #terminal-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #16213e;
      border-bottom: 1px solid #2a2a4e;
    }
    #header span { font-size: 14px; color: #a0a0a0; }
    #header button {
      padding: 6px 12px;
      background: #e94560;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 12px;
    }
    #terminal {
      flex: 1;
      background: #000;
      min-height: 0;
      overflow: hidden;
    }
    #terminal.hscroll .xterm-viewport { overflow-x: auto; }
    #terminal.hscroll .xterm-screen { width: max-content; }
    .hidden { display: none !important; }
    #keyboard-toolbar {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #16213e;
      border-top: 1px solid #2a2a4e;
      flex-wrap: wrap;
      justify-content: center;
    }
    #keyboard-toolbar button {
      padding: 10px 14px;
      background: #2a2a4e;
      border: 1px solid #3a3a5e;
      border-radius: 6px;
      color: #eaeaea;
      font-size: 14px;
      cursor: pointer;
      min-width: 44px;
      touch-action: manipulation;
    }
    #keyboard-toolbar button:active {
      background: #e94560;
    }
    .arrow-btn {
      font-size: 18px !important;
    }
    #copy-btn, #paste-btn {
      background: #3a5a7c;
    }
    #copy-btn:active, #paste-btn:active {
      background: #4ecca3;
    }
    .upload-btn {
      background: #5a3a7c !important;
    }
    .upload-btn:active {
      background: #7c5aa0 !important;
    }
    .upload-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: #2a2a4e;
      border-top: 1px solid #3a3a5e;
      color: #eaeaea;
      font-size: 14px;
    }
    .upload-status.hidden {
      display: none;
    }
    .upload-spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .upload-status.success {
      background: #1a4a3a;
    }
    .upload-status.error {
      background: #4a1a2a;
    }
    #sessions-btn {
      padding: 6px 12px;
      background: #2a2a4e;
      border: 1px solid #3a3a5e;
      border-radius: 4px;
      color: #eaeaea;
      font-size: 12px;
      cursor: pointer;
    }
    #sessions-panel {
      background: #16213e;
      border-bottom: 1px solid #2a2a4e;
      padding: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .session-item {
      padding: 10px;
      margin-bottom: 4px;
      background: #2a2a4e;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .session-item:active, .session-item.active {
      background: #e94560;
    }
    .session-item .type {
      font-size: 11px;
      color: #a0a0a0;
      text-transform: uppercase;
    }
    .session-item .activity {
      font-size: 11px;
      color: #a0a0a0;
      margin-top: 2px;
    }
    .new-session-row {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #2a2a4e;
      margin-bottom: 8px;
    }
    .new-session-row select {
      flex: 1;
      padding: 8px;
      background: #1a1a2e;
      border: 1px solid #3a3a5e;
      border-radius: 4px;
      color: #eaeaea;
      font-size: 14px;
    }
    .new-session-row button {
      padding: 8px 12px;
      background: #4ecca3;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .new-session-row button:active {
      background: #3db892;
    }
    .display-settings {
      border-top: 1px solid #2a2a4e;
      padding: 8px;
    }
    .display-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .display-row:last-child {
      margin-bottom: 0;
    }
    .display-label {
      width: 42px;
      color: #a0a0a0;
      flex-shrink: 0;
    }
    .display-row input[type="range"] {
      flex: 1;
    }
    .display-row input[type="number"] {
      width: 72px;
      padding: 6px;
      background: #1a1a2e;
      border: 1px solid #3a3a5e;
      border-radius: 4px;
      color: #eaeaea;
      font-size: 12px;
    }
    .display-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a0a0a0;
      font-size: 12px;
    }
    .display-value {
      min-width: 24px;
      text-align: right;
      color: #a0a0a0;
    }
  </style>
</head>
<body>
  <div id="connect-screen">
    <h1>Steve's App</h1>
    <form id="connect-form" autocomplete="on">
      <input type="text" id="username-input" name="username" autocomplete="username" aria-hidden="true" tabindex="-1" style="position: absolute; left: -9999px; width: 1px; height: 1px;">
      <input type="password" id="password-input" placeholder="API Token" autocomplete="current-password">
      <button type="submit" id="connect-btn">Connect</button>
    </form>
    <div id="status"></div>
    <button type="button" id="install-btn" class="install-btn hidden">Install App</button>
  </div>

  <div id="terminal-screen">
    <div id="header">
      <button id="sessions-btn">Sessions</button>
      <span id="session-info">Connecting...</span>
      <button id="disconnect-btn">Disconnect</button>
    </div>
    <div id="sessions-panel" class="hidden">
      <div class="new-session-row">
        <select id="shell-select">
          <option value="bash">bash</option>
          <option value="zsh">zsh</option>
          <option value="sh">sh</option>
        </select>
        <button id="new-session-btn">+ New</button>
      </div>
      <div id="sessions-list"></div>
      <div class="display-settings">
        <div class="display-row">
          <span class="display-label">Font</span>
          <input type="range" id="font-size" min="10" max="18" step="1" value="14">
          <span id="font-size-value" class="display-value">14</span>
        </div>
        <div class="display-row">
          <span class="display-label">Cols</span>
          <input type="number" id="cols-input" min="40" max="240" step="1" placeholder="auto">
          <label class="display-toggle"><input type="checkbox" id="fit-toggle" checked> Fit</label>
        </div>
        <div class="display-row">
          <label class="display-toggle"><input type="checkbox" id="hscroll-toggle" checked> Horizontal scroll</label>
        </div>
      </div>
    </div>
    <div id="terminal"></div>
    <div id="keyboard-toolbar">
      <button data-key="\x1b[A" class="arrow-btn">▲</button>
      <button data-key="\x1b[B" class="arrow-btn">▼</button>
      <button data-key="\x1b[D" class="arrow-btn">◀</button>
      <button data-key="\x1b[C" class="arrow-btn">▶</button>
      <button data-key="\x7f" class="key-btn">⌫</button>
      <button data-key="\x09" class="key-btn">Tab</button>
      <button data-key="\x0d" class="key-btn">Enter</button>
      <button data-key="\x03" class="key-btn">Ctrl+C</button>
      <button data-key="\x04" class="key-btn">Ctrl+D</button>
      <button data-key="\x1b" class="key-btn">Esc</button>
      <button id="copy-btn" class="key-btn">Copy</button>
      <button id="paste-btn" class="key-btn">Paste</button>
      <button id="upload-btn" class="key-btn upload-btn">📷</button>
      <input type="file" id="file-input" accept="image/*" style="display: none;">
    </div>
    <div id="upload-status" class="upload-status hidden">
      <span class="upload-spinner">⏳</span>
      <span id="upload-text">Uploading...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/steveseguin/ninjasdk@latest/vdoninja-sdk.min.js"></script>
  <script>
    class PhoneClient {
      constructor() {
        this.vdo = null;
        this.term = null;
        this.fitAddon = null;
        this.connected = false;
        this.connecting = false;
        this.sessions = [];
        this.currentSession = null;
        this.attachedSessionId = null;
        this.sessionBuffers = {}; // Store buffer per session
        this.sessionActivity = {}; // Track last activity per session
        this.sessionHasPty = {}; // Track PTY status per session
        this.activePeerUuid = null;
        this.fontSize = 14;
        this.autoFit = true;
        this.manualCols = null;
        this.hscrollEnabled = true;

        this.connectScreen = document.getElementById('connect-screen');
        this.terminalScreen = document.getElementById('terminal-screen');
        this.passwordInput = document.getElementById('password-input');
        this.connectBtn = document.getElementById('connect-btn');
        this.installBtn = document.getElementById('install-btn');
        this.disconnectBtn = document.getElementById('disconnect-btn');
        this.sessionsBtn = document.getElementById('sessions-btn');
        this.sessionsPanel = document.getElementById('sessions-panel');
        this.sessionsList = document.getElementById('sessions-list');
        this.status = document.getElementById('status');
        this.sessionInfo = document.getElementById('session-info');
        this.terminalContainer = document.getElementById('terminal');
        this.fontSizeInput = document.getElementById('font-size');
        this.fontSizeValue = document.getElementById('font-size-value');
        this.colsInput = document.getElementById('cols-input');
        this.fitToggle = document.getElementById('fit-toggle');
        this.hscrollToggle = document.getElementById('hscroll-toggle');

        // Check URL params or localStorage
        const params = new URLSearchParams(window.location.search);
        const savedToken = localStorage.getItem('steves-app-token');
        this.debug = params.get('debug') === '1';
        this.room = params.get('room') || 'steves-app';
        this.targetStreamId = params.get('stream') || 'server';
        this.salt = params.get('salt') || 'steves.app';
        const paramFont = parseInt(params.get('font'), 10);
        if (Number.isFinite(paramFont)) {
          this.fontSize = Math.min(Math.max(paramFont, 10), 24);
        }
        const paramCols = parseInt(params.get('cols'), 10);
        if (Number.isFinite(paramCols)) {
          this.manualCols = Math.max(paramCols, 40);
          this.autoFit = false;
        }
        if (params.get('fit') === '0') {
          this.autoFit = false;
        }
        if (params.get('hscroll') === '0') {
          this.hscrollEnabled = false;
        }
        const tokenParam = params.get('token');
        if (tokenParam) {
          this.passwordInput.value = tokenParam;
          localStorage.setItem('steves-app-token', tokenParam);
          params.delete('token');
          const qs = params.toString();
          const cleanUrl = qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
          window.history.replaceState({}, '', cleanUrl);
        } else if (savedToken) {
          this.passwordInput.value = savedToken;
        }

        this.fontSizeInput.value = this.fontSize;
        this.fontSizeValue.textContent = this.fontSize;
        if (this.manualCols) {
          this.colsInput.value = this.manualCols;
        }
        this.fitToggle.checked = this.autoFit;
        this.colsInput.disabled = this.autoFit;
        this.hscrollToggle.checked = this.hscrollEnabled;
        this.toggleHScroll(this.hscrollEnabled);

        document.getElementById('connect-form').addEventListener('submit', (e) => {
          e.preventDefault();
          this.connect();
        });
        if (this.installBtn) {
          this.installBtn.addEventListener('click', () => this.promptInstall());
        }
        this.disconnectBtn.addEventListener('click', () => this.disconnect());
        this.sessionsBtn.addEventListener('click', () => this.toggleSessionsPanel());
        this.fontSizeInput.addEventListener('input', () => {
          const value = parseInt(this.fontSizeInput.value, 10);
          if (Number.isFinite(value)) {
            this.setFontSize(value);
          }
        });
        this.colsInput.addEventListener('change', () => {
          const value = parseInt(this.colsInput.value, 10);
          if (Number.isFinite(value)) {
            this.manualCols = Math.max(value, 40);
            if (!this.autoFit) {
              this.applyResize();
            }
          }
        });
        this.fitToggle.addEventListener('change', () => {
          this.autoFit = this.fitToggle.checked;
          this.colsInput.disabled = this.autoFit;
          if (!this.autoFit && !this.manualCols && this.term) {
            this.manualCols = this.term.cols;
            this.colsInput.value = this.manualCols;
          }
          this.applyResize();
        });
        this.hscrollToggle.addEventListener('change', () => {
          this.hscrollEnabled = this.hscrollToggle.checked;
          this.toggleHScroll(this.hscrollEnabled);
        });

        // New session button
        document.getElementById('new-session-btn').addEventListener('click', () => {
          const shell = document.getElementById('shell-select').value;
          this.createSession(shell);
        });

        // Auto-connect if token provided via URL
        if (tokenParam) {
          this.connect();
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        this.installPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          this.installPrompt = e;
          if (this.installBtn) {
            this.installBtn.classList.remove('hidden');
          }
        });
        window.addEventListener('appinstalled', () => {
          this.installPrompt = null;
          if (this.installBtn) {
            this.installBtn.classList.add('hidden');
          }
        });
      }

      toggleSessionsPanel() {
        this.sessionsPanel.classList.toggle('hidden');
        if (!this.sessionsPanel.classList.contains('hidden')) {
          this.renderSessions();
        }
      }

      promptInstall() {
        if (!this.installPrompt) return;
        const promptEvent = this.installPrompt;
        this.installPrompt = null;
        promptEvent.prompt();
        promptEvent.userChoice.finally(() => {
          if (this.installBtn) {
            this.installBtn.classList.add('hidden');
          }
        });
      }

      createSession(shell) {
        this.log('Creating new session:', shell);
        this.sendData({ type: 'createSession', shell });
        // Hide panel after creating
        this.sessionsPanel.classList.add('hidden');
      }

      ensureSession(sessionId) {
        if (!sessionId) return;
        const exists = this.sessions.some(s => s.id === sessionId);
        if (!exists) {
          this.sessions.push({ id: sessionId, type: 'unknown', shell: null, title: null });
        }
      }

      activateSessionIfUnset(sessionId) {
        if (!this.currentSession && sessionId) {
          this.selectSession(sessionId, false);
        }
      }

      renderSessions() {
        this.sessionsList.innerHTML = '';
        for (const session of this.sessions) {
          const div = document.createElement('div');
          div.className = 'session-item' + (session.id === this.currentSession ? ' active' : '');
          const name = session.shell || session.title || session.id.substring(0, 8);
          const activity = this.getActivityText(session.id);
          div.innerHTML = `<div class="type">${session.type}</div><div>${name}</div><div class="activity">${activity}</div>`;
          div.addEventListener('click', () => {
            this.selectSession(session.id);
            this.sessionsPanel.classList.add('hidden');
          });
          this.sessionsList.appendChild(div);
        }
        if (this.sessions.length === 0) {
          this.sessionsList.innerHTML = '<div style="color: #a0a0a0; padding: 10px;">No sessions available</div>';
        }
      }

      getActivityText(sessionId) {
        const lastActivity = this.sessionActivity[sessionId];
        if (!lastActivity) return '';

        const elapsed = Date.now() - lastActivity;
        if (elapsed < 10000) {
          return '<span style="color: #4ecca3;">Active</span>';
        }

        const seconds = Math.floor(elapsed / 1000);
        if (seconds < 60) return `${seconds}s ago`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        return `${hours}h ago`;
      }

      selectSession(sessionId, shouldAttach = true) {
        this.currentSession = sessionId;
        const session = this.sessions.find(s => s.id === sessionId);
        this.sessionInfo.textContent = session ? (session.shell || session.id.substring(0, 8)) : sessionId.substring(0, 8);

        // Clear terminal and show buffer for this session
        if (this.term) {
          this.term.clear();
          if (this.sessionBuffers[sessionId]) {
            this.term.write(this.sessionBuffers[sessionId]);
          }
        }

        if (shouldAttach && this.attachedSessionId !== sessionId) {
          // Request fresh buffer from host
          this.sendData({ type: 'attach', sessionId });
        }

        this.sendResize();
      }

      async connect() {
        if (this.connected || this.connecting) return;
        this.connecting = true;
        const room = this.room;
        const password = this.passwordInput.value.trim();

        if (!password) {
          this.status.textContent = 'Please enter API token';
          this.connecting = false;
          return;
        }

        // Save token for convenience
        localStorage.setItem('steves-app-token', password);

        this.status.textContent = 'Connecting...';

        try {
          this.vdo = new VDONinjaSDK({ salt: this.salt });

          this.vdo.addEventListener('dataReceived', (e) => {
            const msg = e.detail.data;
            const uuid = e.detail.uuid;
            if (uuid) {
              if (!this.activePeerUuid) {
                this.activePeerUuid = uuid;
              } else if (this.activePeerUuid !== uuid) {
                this.log('Ignoring data from extra peer:', uuid);
                return;
              }
            }
            this.log('Received:', msg);

            if (msg.type === 'output') {
              // Store in buffer for current session
              const sid = msg.sessionId || this.currentSession;
              this.ensureSession(sid);
              if (sid) {
                this.sessionBuffers[sid] = (this.sessionBuffers[sid] || '') + msg.data;
                this.sessionActivity[sid] = Date.now();
                // Limit buffer size
                if (this.sessionBuffers[sid].length > 50000) {
                  this.sessionBuffers[sid] = this.sessionBuffers[sid].slice(-50000);
                }
              }
              this.activateSessionIfUnset(sid);
              // Only display if it's our selected session (or no session filter)
              if (this.term && (!msg.sessionId || msg.sessionId === this.currentSession)) {
                this.term.write(msg.data);
              }
            } else if (msg.type === 'activity') {
              // Activity update from host
              if (msg.activity) {
                this.sessionActivity = { ...this.sessionActivity, ...msg.activity };
              }
            } else if (msg.type === 'buffer') {
              const sid = msg.sessionId || this.currentSession;
              this.ensureSession(sid);
              if (sid) {
                this.sessionBuffers[sid] = msg.data;
                this.attachedSessionId = sid;
              }
              this.activateSessionIfUnset(sid);
              if (this.term && (!msg.sessionId || msg.sessionId === this.currentSession)) {
                this.term.clear();
                if (msg.data) this.term.write(msg.data);
              }
            } else if (msg.type === 'sessions') {
              this.log('Sessions:', msg.sessions);
              this.sessions = msg.sessions;
              // Validate currentSession still exists, reset if not
              if (this.currentSession) {
                const exists = msg.sessions.some(s => s.id === this.currentSession);
                if (!exists && msg.sessions.length > 0) {
                  this.log('Current session no longer exists, resetting');
                  this.currentSession = null;
                }
              }
              // Auto-attach to first session if needed
              if (msg.sessions.length > 0 && !this.currentSession) {
                this.selectSession(msg.sessions[0].id);
              }
            } else if (msg.type === 'info') {
              // Track PTY status for this session
              if (msg.sessionId) {
                this.attachedSessionId = msg.sessionId;
                this.sessionHasPty[msg.sessionId] = msg.hasPty || false;
              }
              // Only update display if we requested this session
              if (!this.currentSession || msg.sessionId === this.currentSession) {
                this.currentSession = msg.sessionId;
                const session = this.sessions.find(s => s.id === msg.sessionId);
                const mode = msg.hasPty ? 'PTY' : 'line';
                this.sessionInfo.textContent = (session?.shell || msg.sessionType) + ' (' + mode + '): ' + msg.sessionId.substring(0, 8);
              }
            }
          });

          this.vdo.addEventListener('peerConnected', (e) => {
            const uuid = e.detail?.uuid;
            if (uuid && !this.activePeerUuid) {
              this.activePeerUuid = uuid;
            }
            this.log('Connected to host (peer)', uuid || '');
            this.sessionInfo.textContent = 'Peer connected - waiting for data channel...';
          });

          this.vdo.addEventListener('peerDisconnected', (e) => {
            const uuid = e.detail?.uuid;
            this.log('Host disconnected', uuid || '');
            if (uuid && uuid === this.activePeerUuid) {
              this.activePeerUuid = null;
              this.dataChannelReady = false;
            }
            this.sessionInfo.textContent = 'Host disconnected';
          });

          // Wait for data channel to be ready
          this.dataChannelReady = false;
          this.vdo.addEventListener('dataChannelOpen', (e) => {
            const uuid = e.detail?.uuid;
            if (uuid) {
              if (!this.activePeerUuid) {
                this.activePeerUuid = uuid;
              } else if (this.activePeerUuid !== uuid) {
                this.log('Ignoring data channel from extra peer:', uuid);
                return;
              }
            }
            this.log('Data channel open!', uuid || '');
            this.dataChannelReady = true;
            this.sessionInfo.textContent = 'Connected - waiting for sessions...';
            this.sendData({ type: 'getSessions' });
            if (this.relayTimeout) {
              clearTimeout(this.relayTimeout);
              this.relayTimeout = null;
            }
          });

          await this.vdo.connect();

          // Listen for room listing to find the host
          this.viewedStream = false;
          this.vdo.addEventListener('listing', (e) => {
            this.log('Room listing:', e.detail);
            if (this.viewedStream) return; // Only view once

            const list = e.detail.list || [];
            const target = this.targetStreamId;
            const hostEntry = list.find(entry => entry.streamID === target)
              || list.find(entry => entry.streamID && entry.streamID.startsWith(target));
            if (hostEntry) {
              this.log('Connecting to host stream:', hostEntry.streamID);
              this.viewedStream = true;
              this.vdo.view(hostEntry.streamID, { audio: false, video: false });
            }
          });

          // Handle host joining after us
          this.vdo.addEventListener('videoaddedtoroom', (e) => {
            this.log('Video added to room:', e.detail);
            if (this.viewedStream) return; // Already connected

            const streamID = e.detail.streamID;
            const target = this.targetStreamId;
            // Only connect if it's the target stream
            if (streamID && (streamID === target || streamID.startsWith(target))) {
              this.log('Host joined, connecting to stream:', streamID);
              this.viewedStream = true;
              this.vdo.view(streamID, { audio: false, video: false });
            }
          });

          await this.vdo.joinRoom({ room, password });

          this.connected = true;
          this.connecting = false;
          this.showTerminal();
          this.relayTimeout = setTimeout(() => {
            if (!this.dataChannelReady) {
              this.sessionInfo.textContent = 'Waiting for P2P relay... check server P2P settings.';
            }
          }, 7000);

        } catch (err) {
          console.error('Connection failed:', err);
          this.status.textContent = 'Failed: ' + err.message;
          this.connecting = false;
        }
      }

      showTerminal() {
        this.connectScreen.style.display = 'none';
        this.terminalScreen.style.display = 'flex';

        this.term = new Terminal({
          cursorBlink: true,
          fontSize: this.fontSize,
          fontFamily: 'monospace',
          allowProposedApi: true,
          theme: {
            background: '#1a1a2e',
            foreground: '#eaeaea',
            cursor: '#e94560',
            cursorAccent: '#1a1a2e',
            selectionBackground: '#e9456050',
            // ANSI 16-color palette
            black: '#1a1a2e',
            red: '#e94560',
            green: '#4ecca3',
            yellow: '#f9ed69',
            blue: '#3498db',
            magenta: '#9b59b6',
            cyan: '#00d9ff',
            white: '#eaeaea',
            brightBlack: '#4a4a6e',
            brightRed: '#ff6b8a',
            brightGreen: '#7dffce',
            brightYellow: '#fff89a',
            brightBlue: '#5dade2',
            brightMagenta: '#bb8fce',
            brightCyan: '#40e0ff',
            brightWhite: '#ffffff'
          }
        });

        this.fitAddon = new FitAddon.FitAddon();
        this.term.loadAddon(this.fitAddon);
        this.term.open(this.terminalContainer);
        this.term.onResize(({ cols, rows }) => {
          if (!this.currentSession) return;
          this.sendData({ type: 'resize', cols, rows, sessionId: this.currentSession });
        });
        this.applyResize();

        this.term.onData((data) => {
          // Send to host with sessionId
          this.sendData({ type: 'input', data, sessionId: this.currentSession });
        });

        // Keyboard toolbar buttons
        document.querySelectorAll('#keyboard-toolbar button[data-key]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const key = btn.dataset.key;
            if (key) {
              // Parse escape sequences
              const data = key.replace(/\\x([0-9a-fA-F]{2})/g, (_, hex) =>
                String.fromCharCode(parseInt(hex, 16))
              );
              this.sendData({ type: 'input', data, sessionId: this.currentSession });
            }
            this.term.focus();
          });
        });

        // Copy button
        document.getElementById('copy-btn').addEventListener('click', async (e) => {
          e.preventDefault();
          await this.copyToClipboard();
          this.term.focus();
        });

        // Paste button
        document.getElementById('paste-btn').addEventListener('click', async (e) => {
          e.preventDefault();
          await this.pasteFromClipboard();
          this.term.focus();
        });

        // Upload button
        document.getElementById('upload-btn').addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById('file-input').click();
        });

        // File input change
        document.getElementById('file-input').addEventListener('change', async (e) => {
          this.log('File input changed:', e.target.files);
          const file = e.target.files[0];
          if (file) {
            this.log('Starting upload for:', file.name, file.type, file.size);
            await this.uploadFile(file);
            e.target.value = ''; // Reset for next upload
          }
        });

        // Handle Ctrl+C copy / Ctrl+V paste
        this.term.attachCustomKeyEventHandler((e) => {
          const key = e.key.toLowerCase();
          const isModifier = e.ctrlKey || e.metaKey;

          if (isModifier && key === 'v' && e.type === 'keydown') {
            this.pasteFromClipboard();
            return false;
          }

          if (isModifier && key === 'c' && e.type === 'keydown') {
            const selection = this.term.getSelection();
            if (selection) {
              this.copyToClipboard(selection);
              return false;
            }
          }
          return true;
        });

        // Document-level paste handler
        document.addEventListener('paste', (e) => {
          if (!this.term) return;
          e.preventDefault();
          const text = e.clipboardData?.getData('text');
          if (text && this.currentSession) {
            this.sendData({ type: 'input', data: text, sessionId: this.currentSession, paste: true });
          }
        });

        // Document-level copy handler
        document.addEventListener('copy', (e) => {
          if (!this.term) return;
          const selection = this.term.getSelection();
          if (selection) {
            e.preventDefault();
            e.clipboardData?.setData('text/plain', selection);
          }
        });

        this.term.focus();
        window.addEventListener('resize', () => this.applyResize());
      }

      setFontSize(size) {
        const clamped = Math.min(Math.max(size, 10), 24);
        this.fontSize = clamped;
        this.fontSizeInput.value = clamped;
        this.fontSizeValue.textContent = clamped;
        if (this.term) {
          this.term.options.fontSize = clamped;
          this.applyResize();
        }
      }

      applyResize() {
        if (!this.term || !this.fitAddon) return;
        if (this.autoFit || !this.manualCols) {
          this.fitAddon.fit();
        } else {
          const dims = this.fitAddon.proposeDimensions();
          const rows = dims ? dims.rows : this.term.rows;
          this.term.resize(this.manualCols, rows);
        }
        this.sendResize();
      }

      sendResize() {
        if (!this.term || !this.currentSession) return;
        this.sendData({
          type: 'resize',
          cols: this.term.cols,
          rows: this.term.rows,
          sessionId: this.currentSession
        });
      }

      toggleHScroll(enabled) {
        if (!this.terminalContainer) return;
        this.terminalContainer.classList.toggle('hscroll', enabled);
      }

      log(...args) {
        if (this.debug) {
          console.log(...args);
        }
      }

      sendData(data) {
        if (this.vdo && this.connected && this.dataChannelReady) {
          this.log('sendData:', data.type, data.type === 'upload' ? `(${data.filename})` : '');
          const target = this.activePeerUuid ? { uuid: this.activePeerUuid } : null;
          this.vdo.sendData(data, target || undefined);
        } else {
          this.log('Cannot send - channel not ready, connected:', this.connected, 'dataChannelReady:', this.dataChannelReady);
        }
      }

      async copyToClipboard(text) {
        if (!text) {
          text = this.term?.getSelection();
        }
        if (!text) {
          this.log('Nothing to copy');
          return;
        }

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            this.log('Copied to clipboard');
            return;
          }
        } catch (err) {
          this.log('Clipboard API failed, trying fallback:', err.message);
        }

        // Fallback
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          document.execCommand('copy');
          document.body.removeChild(textarea);
          this.log('Fallback copy succeeded');
        } catch (err) {
          console.error('Fallback copy failed:', err);
        }
      }

      async pasteFromClipboard() {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && this.currentSession) {
              // Mark as paste so server can handle large pastes specially
              this.sendData({ type: 'input', data: text, sessionId: this.currentSession, paste: true });
            }
            return;
          }
        } catch (err) {
          this.log('Clipboard API paste failed:', err.message);
        }

        // Fallback - try using execCommand (may not work in all browsers)
        try {
          const textarea = document.createElement('textarea');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          const ok = document.execCommand('paste');
          const text = textarea.value;
          document.body.removeChild(textarea);
          this.term?.focus();

          if (ok && text && this.currentSession) {
            this.sendData({ type: 'input', data: text, sessionId: this.currentSession, paste: true });
          }
        } catch (err) {
          console.error('Fallback paste failed:', err);
        }
      }

      async uploadFile(file) {
        this.log('uploadFile called:', file.name);
        const statusEl = document.getElementById('upload-status');
        const textEl = document.getElementById('upload-text');

        // Show uploading status
        statusEl.classList.remove('hidden', 'success', 'error');
        textEl.textContent = `Uploading ${file.name}...`;

        try {
          // Read file as base64
          this.log('Reading file as base64...');
          const base64 = await this.fileToBase64(file);
          this.log('Base64 ready, length:', base64.length);

          this.log('Sending upload:', file.name, 'session:', this.currentSession);

          // WebRTC data channels have ~16KB limit, so chunk large uploads
          const CHUNK_SIZE = 12000; // Leave room for JSON overhead
          if (base64.length > CHUNK_SIZE) {
            // Send in chunks
            const totalChunks = Math.ceil(base64.length / CHUNK_SIZE);
            const uploadId = Date.now().toString(36);
            this.log(`Sending ${totalChunks} chunks for upload ${uploadId}`);

            for (let i = 0; i < totalChunks; i++) {
              const chunk = base64.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
              this.sendData({
                type: 'uploadChunk',
                uploadId,
                filename: file.name,
                mimeType: file.type,
                chunk,
                chunkIndex: i,
                totalChunks,
                sessionId: this.currentSession
              });
            }
          } else {
            // Small enough to send in one message
            this.sendData({
              type: 'upload',
              filename: file.name,
              mimeType: file.type,
              data: base64,
              sessionId: this.currentSession
            });
          }

          // Wait for confirmation (timeout after 10s)
          const confirmed = await this.waitForUploadConfirmation(10000);

          if (confirmed) {
            statusEl.classList.add('success');
            textEl.textContent = `Uploaded: ${file.name}`;
          } else {
            throw new Error('Upload timeout - no response from host');
          }
        } catch (err) {
          console.error('Upload failed:', err);
          statusEl.classList.add('error');
          textEl.textContent = `Failed: ${err.message}`;
        }

        // Hide status after 3 seconds and restore input
        setTimeout(() => {
          statusEl.classList.add('hidden');
          this.term?.focus();
        }, 3000);

        // Refocus terminal immediately too
        setTimeout(() => this.term?.focus(), 100);
      }

      fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            // Remove data URL prefix to get just base64
            const base64 = reader.result.split(',')[1];
            resolve(base64);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      waitForUploadConfirmation(timeout) {
        return new Promise((resolve) => {
          this.log('Waiting for uploadComplete confirmation...');
          let resolved = false;
          let timeoutId = null;

          const handler = (e) => {
            const msg = e.detail.data;
            this.log('Upload wait - received message:', msg.type);
            if (msg.type === 'uploadComplete' && !resolved) {
              this.log('Upload confirmed!', msg);
              resolved = true;
              clearTimeout(timeoutId);
              this.vdo.removeEventListener('dataReceived', handler);
              resolve(true);
            }
          };
          this.vdo.addEventListener('dataReceived', handler);

          timeoutId = setTimeout(() => {
            if (!resolved) {
              this.log('Upload confirmation timeout');
              resolved = true;
              this.vdo.removeEventListener('dataReceived', handler);
              resolve(false);
            }
          }, timeout);
        });
      }

      localEcho(data) {
        if (!this.term) return;

        // Skip local echo for PTY sessions (PTY echoes automatically)
        if (this.currentSession && this.sessionHasPty[this.currentSession]) return;

        // Don't echo escape sequences (arrow keys, etc)
        if (data.startsWith('\x1b')) return;

        // Handle special characters
        if (data === '\r') {
          this.term.write('\r\n');
        } else if (data === '\x7f' || data === '\b') {
          // Backspace - move back, space, move back
          this.term.write('\b \b');
        } else if (data === '\x03') {
          // Ctrl+C
          this.term.write('^C\r\n');
        } else if (data.charCodeAt(0) >= 32 || data.length > 1) {
          // Printable characters or pasted text
          this.term.write(data);
        }
      }

      disconnect() {
        if (this.vdo) {
          this.vdo.disconnect();
          this.vdo = null;
        }
        this.connected = false;
        this.connecting = false;
        this.attachedSessionId = null;
        this.activePeerUuid = null;
        if (this.term) {
          this.term.dispose();
          this.term = null;
        }
        this.terminalScreen.style.display = 'none';
        this.connectScreen.style.display = 'flex';
        this.status.textContent = 'Disconnected';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.phoneClient = new PhoneClient();
    });
  </script>
</body>
</html>
